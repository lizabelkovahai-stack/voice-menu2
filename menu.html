<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Голосовое меню</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0; padding: 12px; background: #111; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center; user-select: none;
  }
  .tap-zone { position: fixed; inset: 0; z-index: 9999; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-width: 500px; margin: 0 auto 14px; pointer-events: none; }
  .tile { background: #222; border: 2px solid #333; border-radius: 10px; padding: 8px 6px; text-align: center; transition: all 0.2s; min-height: 70px; display: flex; flex-direction: column; justify-content: center; }
  .tile.active { border-color: #007bff; background: #1a3a5c; transform: scale(1.04); box-shadow: 0 0 14px rgba(0,123,255,0.6); }
  .tile-title { font-size: 13px; font-weight: bold; }
  .tile-sub { font-size: 10px; color: #888; margin-top: 3px; }
  .dish-card { background: #1a1a1a; border: 3px solid #007bff; border-radius: 14px; padding: 18px 14px; max-width: 500px; margin: 0 auto; text-align: center; pointer-events: none; }
  .dish-day { font-size: 12px; color: #888; }
  .dish-section { font-size: 14px; color: #4dabf7; margin-top: 4px; }
  .dish-name { font-size: 26px; font-weight: bold; margin-top: 4px; }
  .dish-price { font-size: 20px; color: #4dabf7; margin-top: 6px; }
  .dish-count { font-size: 12px; color: #666; margin-top: 6px; }
  .status { margin-top: 12px; text-align: center; color: #aaa; font-size: 13px; min-height: 18px; pointer-events: none; }
</style>
</head>
<body>

<div class="tap-zone" id="tapZone"></div>
<div class="grid" id="grid"></div>

<div class="dish-card">
  <div class="dish-day" id="dishDay">День 1 из 10</div>
  <div class="dish-section" id="dishSection">Завтрак</div>
  <div class="dish-name" id="dishName">Омлет 1</div>
  <div class="dish-price" id="dishPrice">250 руб.</div>
  <div class="dish-count" id="dishCount">Блюдо 1 из 3</div>
</div>

<div class="status" id="status">1 тап — слушать день. 2 тапа — выбрать день.</div>

<script>
  const days = [];
  for (let i = 1; i <= 10; i++) {
    days.push({
      title: `День ${i}`,
      sections: [
        { name: "Завтрак", items: [
          { name: `Омлет ${i}`, price: 250 }, { name: `Каша ${i}`, price: 180 }, { name: `Сырники ${i}`, price: 220 }
        ]},
        { name: "Обед", items: [
          { name: `Борщ ${i}`, price: 300 }, { name: `Котлета ${i}`, price: 350 }, { name: `Плов ${i}`, price: 320 }
        ]},
        { name: "Ужин", items: [
          { name: `Стейк ${i}`, price: 700 }, { name: `Рыба ${i}`, price: 450 }, { name: `Салат ${i}`, price: 200 }
        ]}
      ]
    });
  }

  let dayIndex = 0, sectionIndex = 0, itemIndex = 0;
  let isListening = false, isSpeaking = false;
  const synth = window.speechSynthesis;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  // Огромный словарь чисел, чтобы точно понять "пять" и "пятый"
  const numWords = {
    '1': 1, 'один': 1, 'одн': 1, 'перв': 1,
    '2': 2, 'два': 2, 'две': 2, 'втор': 2,
    '3': 3, 'три': 3, 'трет': 3,
    '4': 4, 'четыре': 4, 'четверт': 4,
    '5': 5, 'пять': 5, 'пят': 5,
    '6': 6, 'шесть': 6, 'шест': 6,
    '7': 7, 'семь': 7, 'седьм': 7,
    '8': 8, 'восемь': 8, 'восьм': 8,
    '9': 9, 'девять': 9, 'девят': 9,
    '10': 10, 'десять': 10, 'десят': 10
  };

  function speak(text, onEndCallback) {
    if (!synth) return;
    synth.cancel(); 
    isSpeaking = true;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = 1.0;
    u.onend = () => {
      isSpeaking = false;
      if (onEndCallback) onEndCallback();
    };
    synth.speak(u);
  }

  function buildGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    days.forEach((d, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (i === dayIndex ? ' active' : '');
      tile.id = 'tile-' + i;
      tile.innerHTML = `<div class="tile-title">${d.title}</div><div class="tile-sub">З / О / У</div>`;
      grid.appendChild(tile);
    });
  }

  function updateDisplay(announce = true) {
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
    const active = document.getElementById('tile-' + dayIndex);
    if (active) active.classList.add('active');

    const d = days[dayIndex];
    const sec = d.sections[sectionIndex];
    const item = sec.items[itemIndex];

    document.getElementById('dishDay').textContent = `${d.title} из ${days.length}`;
    document.getElementById('dishSection').textContent = sec.name;
    document.getElementById('dishName').textContent = item.name;
    document.getElementById('dishPrice').textContent = item.price + ' руб.';
    document.getElementById('dishCount').textContent = `Блюдо ${itemIndex + 1} из ${sec.items.length}`;

    if (announce) speak(`${d.title}. ${sec.name}. ${item.name}. ${item.price} рублей.`);
  }

  // 1 ТАП: Читаем весь день
  function readDay() {
    const d = days[dayIndex];
    let sec = 0, it = 0;
    function next() {
      if (sec >= d.sections.length) {
        speak('Конец дня. Нажмите два раза, чтобы выбрать другой день.');
        return;
      }
      const s = d.sections[sec];
      if (it >= s.items.length) { sec++; it = 0; next(); return; }
      const item = s.items[it];
      const u = new SpeechSynthesisUtterance(`${s.name}. ${item.name}. ${item.price} рублей.`);
      u.lang = 'ru-RU';
      u.onend = () => { it++; next(); };
      synth.speak(u);
    }
    synth.cancel();
    next();
  }

  // 2 ТАПА: Спрашиваем день
  function askDay() {
    speak('Какой день выбрать? Скажите номер.', () => {
      // Как только робот закончил говорить, включаем микрофон
      setTimeout(() => {
        if (recognition && !isListening) {
          try { recognition.start(); } catch(e) {}
        }
      }, 500);
    });
  }

  function selectDay(n) {
    if (n >= 1 && n <= days.length) {
      dayIndex = n - 1; sectionIndex = 0; itemIndex = 0;
      updateDisplay(true);
      return true;
    }
    return false;
  }

  // Ищем блюдо по названию (Омлет, Борщ и т.д.)
  function selectDish(name) {
    const t = name.toLowerCase();
    for (let d = 0; d < days.length; d++) {
      for (let sec = 0; sec < days[d].sections.length; sec++) {
        const idx = days[d].sections[sec].items.findIndex(item => t.includes(item.name.split(' ')[0].toLowerCase()));
        if (idx !== -1) {
          dayIndex = d; sectionIndex = sec; itemIndex = idx;
          const item = days[d].sections[sec].items[idx];
          updateDisplay(false); 
          speak(`Вы выбрали ${item.name}.`, () => {
             speak('Чтобы услышать меню дальше, нажмите один раз.');
          });
          return true;
        }
      }
    }
    return false;
  }

  if (SR) {
    recognition = new SR();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { isListening = true; };
    recognition.onend = () => { isListening = false; };
    recognition.onerror = () => { isListening = false; };
    
    recognition.onresult = (event) => {
      const t = event.results[0][0].transcript.toLowerCase().trim();
      
      // 1. Ищем любую цифру в тексте
      let foundNum = null;
      const numMatch = t.match(/\d+/);
      if (numMatch) {
        foundNum = parseInt(numMatch[0]);
      } else {
        // 2. Ищем слова (пять, пятый и т.д.)
        for (const word in numWords) {
          if (t.includes(word)) {
            foundNum = numWords[word];
            break;
          }
        }
      }

      // Если нашли число от 1 до 10
      if (foundNum && foundNum >= 1 && foundNum <= 10) {
        if (selectDay(foundNum)) return;
      }

      // Если не число, ищем блюдо
      if (selectDish(t)) return;
      
      speak('Не поняла. Скажите номер дня от одного до десяти.');
    };
  }

  // СЧЕТЧИК ТАПОВ (Сделано надежно)
  let tapCount = 0;
  let tapTimer = null;

  document.getElementById('tapZone').addEventListener('click', () => {
    // Если робот говорит, первый клик просто останавливает его
    if (isSpeaking) {
      synth.cancel();
      isSpeaking = false;
      return;
    }

    tapCount++;
    
    // Если был предыдущий таймер, сбрасываем его
    if (tapTimer) clearTimeout(tapTimer);

    // Ждем 400 мс. Если за это время не было второго тапа — значит это 1 тап.
    tapTimer = setTimeout(() => {
      if (tapCount === 1) {
        readDay(); 
      } else if (tapCount >= 2) {
        askDay();
      }
      tapCount = 0; // сбрасываем после действия
    }, 400);
  });

  buildGrid();
  updateDisplay(true);
</script>
</body>
</html>
